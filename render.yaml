# Alternative host: Render's free plan (the recommended free host is Streamlit
# Community Cloud; see DEPLOY.md). Free Render services have little CPU, sleep
# after 15 minutes without visitors and take about a minute to wake.
# Data is kept in your Neon database (DATABASE_URL), not on Render.
services:
  - type: web
    name: ctc-team-builder
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # copies the Secret File into place, then starts the app
    startCommand: mkdir -p .streamlit && cp /etc/secrets/secrets.toml .streamlit/secrets.toml 2>/dev/null; streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
